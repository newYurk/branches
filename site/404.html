<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ветки · нет такой страницы</title>
    <meta name="robots" content="noindex" />
    <link id="icon" rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      html, body { margin: 0; background: #ece8e1; color: #0c0b09; font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; }
      main { max-width: 30rem; margin: 0 auto; padding: 4rem 1rem; line-height: 1.5; }
      h1 { font-family: "Cormorant Garamond", "Times New Roman", serif; font-weight: 500; font-size: 2.2rem; margin: 0 0 1rem; }
      p { color: #8a847c; }
      a { color: inherit; }
    </style>
  </head>
  <body>
    <main>
      <h1>Такой страницы нет</h1>
      <p>Скорее всего, ветку уже влили или удалили — превью живут, пока жива ветка.</p>
      <p><a id="home" href="/">Все ветки в работе →</a></p>
    </main>
    <script>
      const path = location.pathname
      const at = path.indexOf('/branches/')
      const candidates = []
      if (at >= 0) candidates.push(path.slice(0, at) + '/branches/')
      if (path.endsWith('/branches')) candidates.push(path.slice(0, -'/branches'.length) + '/branches/')
      const first = path.split('/').filter(Boolean)[0]
      if (first) candidates.push('/' + first + '/')
      candidates.push('/')
      const unique = [...new Set(candidates)]
      const apply = (home) => {
        document.getElementById('home').setAttribute('href', home)
        document.getElementById('icon').setAttribute('href', home + 'favicon.svg')
      }
      const probe = (home) => fetch(home + 'plan.json', { cache: 'no-store' }).then((r) => r.ok).catch(() => false)
      Promise.all(unique.map((home) => probe(home))).then((ok) => {
        const at = ok.findIndex(Boolean)
        apply(at >= 0 ? unique[at] : unique[0] || '/')
      })
    </script>
  </body>
</html>
