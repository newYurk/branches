name: publish

# Rebuild every branch of the games and redeploy the whole site to newyurk.github.io/branches/.
# The games' own sites (newyurk.github.io/<game>/, from main) are never touched.
# Started by watch.yml when branches move, by a push here, or by hand (Actions → publish → Run workflow).
on:
  workflow_dispatch:
    inputs:
      force:
        description: Пересобрать, даже если ветки не менялись
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read

# One run at a time; a newer run waits and sees what the older one published.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    outputs:
      changed: ${{ steps.seen.outputs.cache-hit != 'true' || inputs.force == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Branch heads of every game (git ls-remote, no API) plus a hash of this builder.
      - id: heads
        run: echo "fingerprint=$(node tools/plan.mjs heads)" >> "$GITHUB_OUTPUT"

      # A cache entry named after the fingerprint marks "this exact state is already live".
      - id: seen
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .published
          key: published-${{ steps.heads.outputs.fingerprint }}
          lookup-only: true

      # Revives the five-minute watcher if GitHub switched it off for inactivity.
      - name: keep watch.yml on
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable watch.yml -R "$GITHUB_REPOSITORY"

  publish:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://newyurk.github.io/branches/
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Temari builds with Node 24, like its own Pages workflow and its engines field.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: plan
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node tools/plan.mjs full
          echo "fingerprint=$(node -p 'require("./plan.json").fingerprint')" >> "$GITHUB_OUTPUT"

      - name: build every branch
        run: node tools/build.mjs plan.json _site status.json

      - name: listing
        run: node tools/assemble.mjs plan.json _site status.json

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      # "Deployed" is not the same as "served": wait until the site hands out this plan.
      - name: site serves this build
        env:
          WANT: ${{ steps.plan.outputs.fingerprint }}
        run: |
          for i in $(seq 1 36); do
            live=$(curl -fsS "https://newyurk.github.io/branches/plan.json?run=$GITHUB_RUN_ID-$i" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).fingerprint))' \
              2>/dev/null || true)
            if [ "$live" = "$WANT" ]; then echo "live: $live"; exit 0; fi
            sleep 10
          done
          echo "::error::deploy reported success, but the site still serves '${live}' instead of '${WANT}'"
          exit 1

      - name: remember what is live
        run: mkdir -p .published && echo "${{ steps.plan.outputs.fingerprint }}" > .published/fingerprint

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .published
          key: published-${{ steps.plan.outputs.fingerprint }}
